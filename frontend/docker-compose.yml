services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: classpro-frontend-standalone
    # NEXT_PUBLIC_* is inlined into the client bundle while the image builds,
    # so it has to come from frontend/.env at build time -- setting it here or
    # mounting .env at runtime does nothing. Run `bun run sync:env` first.
    environment:
      - NODE_ENV=production
    ports:
      - "243:243"
    restart: unless-stopped
    healthcheck:
      # node, not wget: the final image is node:22-slim, which ships neither
      # wget nor curl. node is always there.
      test: ["CMD", "node", "-e", "fetch('http://localhost:243/home').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    name: classpro-frontend-network 